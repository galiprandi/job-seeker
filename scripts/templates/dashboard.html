<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Seeker Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /*
   * Design tokens from VitePress default dark theme.
   * Matches the docs site at galiprandi.github.io/job-seeker
   */
  :root {
    --vp-bg:          #1b1b1f;
    --vp-bg-alt:      #161618;
    --vp-bg-soft:     #202127;
    --vp-bg-elv:      #202127;
    --vp-border:      #3c3f44;
    --vp-divider:     #2e2e32;
    --vp-text-1:      #dfdfd6;
    --vp-text-2:      #98989f;
    --vp-text-3:      #929295;
    --vp-brand-1:     #a8b1ff;
    --vp-brand-2:     #5c73e7;
    --vp-brand-3:     #5672cd;
    --vp-brand-soft:  rgba(100, 108, 255, .16);
    --vp-green:       #10b981;
    --vp-green-soft:  rgba(16, 185, 129, .16);
    --vp-yellow:      #eab008;
    --vp-yellow-soft: rgba(234, 179, 8, .16);
    --vp-red:         #f43f5e;
    --vp-red-soft:    rgba(244, 63, 94, .16);
    --vp-purple:      #9f7aea;
    --vp-purple-soft: rgba(159, 122, 234, .16);
    --vp-cyan:        #22d3ee;
    --vp-cyan-soft:   rgba(34, 211, 238, .16);
    --vp-orange:      #f97316;
    --vp-orange-soft: rgba(249, 115, 22, .16);
    --vp-gray-soft:   rgba(101, 117, 133, .16);

    --vp-font:        "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --vp-font-mono:   ui-monospace, "Menlo", "Monaco", "Consolas", monospace;

    --radius:         12px;
    --radius-sm:      8px;
    --radius-pill:    20px;

    --shadow-1:       0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.15);
    --shadow-2:       0 3px 12px rgba(0,0,0,.25);
    --shadow-3:       0 8px 24px rgba(0,0,0,.3);

    --transition:     200ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    background: var(--vp-bg);
    color: var(--vp-text-1);
    font-family: var(--vp-font);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button { font-family: inherit; }
  *:focus-visible {
    outline: 2px solid var(--vp-brand-1);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  /* ── Layout shell (matches VitePress doc container) ── */
  .vp-doc {
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ── Header (VitePress var-like) ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    background: var(--vp-bg-alt);
    border-bottom: 1px solid var(--vp-border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--vp-text-1);
  }
  .header-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 12px;
    border-radius: var(--radius-pill);
    background: var(--vp-green-soft);
    color: var(--vp-green);
    border: 1px solid transparent;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .header-meta {
    font-size: 12px;
    color: var(--vp-text-2);
  }
  .refresh-btn {
    background: var(--vp-bg-soft);
    border: 1px solid var(--vp-border);
    color: var(--vp-text-2);
    padding: 6px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: var(--transition);
  }
  .refresh-btn:hover {
    border-color: var(--vp-brand-1);
    color: var(--vp-brand-1);
    background: var(--vp-brand-soft);
  }
  .refresh-btn:active { transform: scale(0.97); }

  .auto-refresh {
    font-size: 11px;
    color: var(--vp-text-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pulse {
    width: 7px;
    height: 7px;
    background: var(--vp-green);
    border-radius: 50%;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--vp-divider);
    border-bottom: 1px solid var(--vp-border);
  }
  .stat-card {
    background: var(--vp-bg);
    padding: 20px 20px;
    text-align: center;
    transition: background var(--transition);
  }
  .stat-card:hover { background: var(--vp-bg-soft); }
  .stat-num {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .stat-label {
    font-size: 10px;
    color: var(--vp-text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 6px;
    font-weight: 600;
  }

  /* ── Section (VitePress doc-style container) ── */
  .section {
    padding: 28px;
    border-bottom: 1px solid var(--vp-divider);
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--vp-text-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 18px;
  }

  /* ── Funnel ── */
  .funnel {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 80px;
  }
  .funnel-bar {
    flex: 1;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8px;
    font-size: 12px;
    font-weight: 700;
    min-height: 24px;
    transition: opacity var(--transition), transform var(--transition);
    cursor: default;
    position: relative;
  }
  .funnel-bar:hover { opacity: 0.85; transform: translateY(-2px); }
  .funnel-bar-count { color: #fff; }
  .funnel-bar-zero { color: var(--vp-text-3); font-weight: 500; }
  .funnel-labels {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .funnel-label {
    flex: 1;
    text-align: center;
    font-size: 10px;
    color: var(--vp-text-3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
  }
  .funnel-conversion {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .funnel-conv-item {
    flex: 1;
    text-align: center;
    font-size: 10px;
    color: var(--vp-text-3);
    font-family: var(--vp-font-mono);
  }

  /* ── Kanban ── */
  .kanban {
    display: flex;
    gap: 1px;
    background: var(--vp-divider);
    overflow-x: auto;
    min-height: 420px;
  }
  .column {
    flex: 1;
    min-width: 250px;
    background: var(--vp-bg);
    display: flex;
    flex-direction: column;
  }
  .column-header {
    padding: 14px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--vp-border);
    position: sticky;
    top: 0;
    background: var(--vp-bg-alt);
    z-index: 10;
  }
  .column-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stage-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .column-count {
    font-size: 11px;
    color: var(--vp-text-3);
    font-weight: 600;
    background: var(--vp-bg-soft);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--vp-border);
    min-width: 28px;
    text-align: center;
  }
  .column-cards {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex: 1;
  }

  /* ── Card ── */
  .card {
    background: var(--vp-bg-soft);
    border: 1px solid var(--vp-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-1);
  }
  .card:hover {
    background: var(--vp-bg-elv);
    border-color: var(--vp-text-3);
    box-shadow: var(--shadow-2);
    transform: translateY(-1px);
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  .card-company {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--vp-text-1);
  }
  .card-date {
    font-size: 10px;
    color: var(--vp-text-3);
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .card-role {
    font-size: 12px;
    color: var(--vp-text-2);
    margin-bottom: 10px;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-tag {
    font-size: 10px;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .tag-high { background: var(--vp-green-soft); color: var(--vp-green); }
  .tag-medium { background: var(--vp-yellow-soft); color: var(--vp-yellow); }
  .tag-low { background: var(--vp-gray-soft); color: var(--vp-text-2); }
  .tag-platform { background: var(--vp-brand-soft); color: var(--vp-brand-1); }

  /* ── Messages ── */
  .messages-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .message-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--vp-bg-soft);
    border: 1px solid var(--vp-border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    transition: var(--transition);
  }
  .message-item:hover {
    background: var(--vp-bg-elv);
    border-color: var(--vp-text-3);
  }
  .message-channel {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 9px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .ch-gmail { background: var(--vp-red-soft); color: var(--vp-red); }
  .ch-linkedin { background: var(--vp-brand-soft); color: var(--vp-brand-1); }
  .ch-platform { background: var(--vp-gray-soft); color: var(--vp-text-2); }
  .message-sender {
    color: var(--vp-text-1);
    font-weight: 500;
    white-space: nowrap;
  }
  .message-subject {
    color: var(--vp-text-2);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .message-status {
    font-size: 9px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .st-pending { background: var(--vp-yellow-soft); color: var(--vp-yellow); }
  .st-draft { background: var(--vp-brand-soft); color: var(--vp-brand-1); }
  .st-sent { background: var(--vp-green-soft); color: var(--vp-green); }
  .st-ignored { background: var(--vp-gray-soft); color: var(--vp-text-2); }
  .message-date {
    font-size: 10px;
    color: var(--vp-text-3);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Targets ── */
  .targets-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .target-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--vp-text-2);
    background: var(--vp-bg-soft);
    border: 1px solid var(--vp-border);
    border-radius: var(--radius-pill);
    padding: 6px 16px;
    transition: var(--transition);
  }
  .target-pill:hover {
    border-color: var(--vp-text-3);
    background: var(--vp-bg-elv);
  }
  .target-pill-num {
    font-weight: 800;
    color: var(--vp-text-1);
    font-size: 13px;
  }

  /* ── Skeleton loading ── */
  .skeleton-header {
    padding: 16px 28px;
    background: var(--vp-bg-alt);
    border-bottom: 1px solid var(--vp-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .skeleton-block {
    background: linear-gradient(90deg, var(--vp-bg-soft) 0%, var(--vp-bg-elv) 50%, var(--vp-bg-soft) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: var(--radius-sm);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton-stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--vp-divider);
  }
  .skeleton-stat {
    background: var(--vp-bg);
    padding: 20px;
    text-align: center;
  }
  .skeleton-kanban {
    display: flex;
    gap: 1px;
    background: var(--vp-divider);
    padding-top: 28px;
  }
  .skeleton-col {
    flex: 1;
    min-width: 250px;
    background: var(--vp-bg);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ── Error ── */
  .error-banner {
    background: var(--vp-red-soft);
    border: 1px solid var(--vp-red);
    color: var(--vp-red);
    padding: 16px 28px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 0;
  }
  .error-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 36px 16px;
  }
  .empty-text {
    font-size: 12px;
    color: var(--vp-text-3);
    margin-bottom: 4px;
  }
  .empty-hint {
    font-size: 11px;
    color: var(--vp-text-3);
    opacity: 0.6;
  }

  /* ── Scrollbar (VitePress-style) ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--vp-border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--vp-text-3); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .stats-bar { grid-template-columns: repeat(3, 1fr); }
    .stat-card:nth-child(4), .stat-card:nth-child(5) { display: none; }
    .header-meta { display: none; }
    .section { padding: 16px; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- Skeleton loading state (VitePress-style shimmer) -->
  <div class="skeleton-header">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="skeleton-block" style="width:160px;height:18px"></div>
      <div class="skeleton-block" style="width:60px;height:20px;border-radius:20px"></div>
    </div>
    <div class="skeleton-block" style="width:80px;height:30px;border-radius:8px"></div>
  </div>
  <div class="skeleton-stats">
    <div class="skeleton-stat"><div class="skeleton-block" style="width:60px;height:28px;margin:0 auto 6px"></div><div class="skeleton-block" style="width:50px;height:10px;margin:0 auto"></div></div>
    <div class="skeleton-stat"><div class="skeleton-block" style="width:60px;height:28px;margin:0 auto 6px"></div><div class="skeleton-block" style="width:50px;height:10px;margin:0 auto"></div></div>
    <div class="skeleton-stat"><div class="skeleton-block" style="width:60px;height:28px;margin:0 auto 6px"></div><div class="skeleton-block" style="width:50px;height:10px;margin:0 auto"></div></div>
    <div class="skeleton-stat"><div class="skeleton-block" style="width:60px;height:28px;margin:0 auto 6px"></div><div class="skeleton-block" style="width:50px;height:10px;margin:0 auto"></div></div>
    <div class="skeleton-stat"><div class="skeleton-block" style="width:60px;height:28px;margin:0 auto 6px"></div><div class="skeleton-block" style="width:50px;height:10px;margin:0 auto"></div></div>
  </div>
  <div class="skeleton-kanban">
    <div class="skeleton-col">
      <div class="skeleton-block" style="width:100px;height:14px;margin-bottom:12px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
    </div>
    <div class="skeleton-col">
      <div class="skeleton-block" style="width:100px;height:14px;margin-bottom:12px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
    </div>
    <div class="skeleton-col">
      <div class="skeleton-block" style="width:100px;height:14px;margin-bottom:12px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
    </div>
    <div class="skeleton-col">
      <div class="skeleton-block" style="width:100px;height:14px;margin-bottom:12px"></div>
      <div class="skeleton-block" style="width:100%;height:68px"></div>
    </div>
  </div>
</div>

<script>
const STAGE_INFO = {
  discovered:  { label: 'Discovered',  color: '#929295' },
  contacted:   { label: 'Contacted',   color: '#22d3ee' },
  applied:     { label: 'Applied',     color: '#a8b1ff' },
  in_review:   { label: 'In Review',   color: '#eab008' },
  screening:   { label: 'Screening',   color: '#f97316' },
  interview:   { label: 'Interview',   color: '#10b981' },
  offer:       { label: 'Offer',       color: '#9f7aea' },
  hired:       { label: 'Hired',       color: '#10b981' },
  rejected:    { label: 'Rejected',    color: '#f43f5e' },
  withdrawn:   { label: 'Withdrawn',   color: '#929295' },
  skipped:     { label: 'Skipped',     color: '#929295' },
};

const ACTIVE_STAGES = ['discovered','contacted','applied','in_review','screening','interview','offer','hired'];

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString();
}

function matchTag(match) {
  if (!match) return '';
  const cls = match === 'high' ? 'tag-high' : match === 'medium' ? 'tag-medium' : 'tag-low';
  const label = match === 'high' ? 'Must' : match === 'medium' ? 'Strong' : 'Nice';
  return `<span class="card-tag ${cls}">${label}</span>`;
}

function platformTag(platform) {
  if (!platform) return '';
  return `<span class="card-tag tag-platform">${escapeHtml(platform)}</span>`;
}

function renderCard(card) {
  return `<div class="card" tabindex="0">
    <div class="card-top">
      <div class="card-company">${escapeHtml(card.company || 'Unknown')}</div>
      <div class="card-date">${formatDate(card.applied_at)}</div>
    </div>
    <div class="card-role">${escapeHtml(card.role || '')}</div>
    <div class="card-meta">
      ${matchTag(card.match)}
      ${platformTag(card.platform)}
    </div>
  </div>`;
}

function renderColumn(stage, cards) {
  const info = STAGE_INFO[stage] || { label: stage, color: '#929295' };
  const filtered = cards.filter(c => c.status === stage);
  const emptyHtml = filtered.length === 0
    ? `<div class="empty"><div class="empty-text">No applications here</div><div class="empty-hint">Run "apply to N jobs" to populate</div></div>`
    : filtered.map(renderCard).join('');
  return `<div class="column">
    <div class="column-header">
      <div class="column-header-left">
        <div class="stage-dot" style="background:${info.color}"></div>
        <span style="color:${info.color}">${info.label}</span>
      </div>
      <span class="column-count">${filtered.length}</span>
    </div>
    <div class="column-cards">${emptyHtml}</div>
  </div>`;
}

function renderFunnel(funnel) {
  const stages = ACTIVE_STAGES;
  const maxCount = Math.max(...stages.map(s => funnel[s] || 0), 1);
  const bars = stages.map(stage => {
    const count = funnel[stage] || 0;
    const pct = (count / maxCount) * 100;
    const info = STAGE_INFO[stage];
    const countDisplay = count > 0
      ? `<span class="funnel-bar-count">${count}</span>`
      : `<span class="funnel-bar-zero">0</span>`;
    return `<div class="funnel-bar" style="height:${Math.max(pct, 8)}%;background:${info.color}" title="${info.label}: ${count}">${countDisplay}</div>`;
  }).join('');

  const labels = stages.map(stage =>
    `<div class="funnel-label">${STAGE_INFO[stage].label}</div>`
  ).join('');

  const conversions = stages.slice(0, -1).map((stage, i) => {
    const current = funnel[stage] || 0;
    const next = funnel[stages[i + 1]] || 0;
    const rate = current > 0 ? Math.round((next / current) * 100) : 0;
    return `<div class="funnel-conv-item">${current > 0 ? rate + '%' : '-'}</div>`;
  }).join('');

  return `${bars}</div><div class="funnel-labels">${labels}</div><div class="funnel-conversion">${conversions}</div>`;
}

function renderMessages(messages) {
  if (!messages || messages.length === 0) {
    return `<div class="empty"><div class="empty-text">No recent messages</div><div class="empty-hint">Run "news" to check for recruiter updates</div></div>`;
  }
  return messages.map(m => {
    const chClass = m.channel === 'gmail' ? 'ch-gmail' : m.channel === 'linkedin' ? 'ch-linkedin' : 'ch-platform';
    const stClass = m.status ? 'st-' + m.status : 'st-pending';
    return `<div class="message-item">
      <span class="message-channel ${chClass}">${escapeHtml(m.channel || 'unknown')}</span>
      <span class="message-sender">${escapeHtml(m.sender || '')}</span>
      <span class="message-subject">${escapeHtml(m.subject || '(no subject)')}</span>
      <span class="message-status ${stClass}">${escapeHtml(m.status || 'pending')}</span>
      <span class="message-date">${formatDate(m.received_at)}</span>
    </div>`;
  }).join('');
}

function renderTargets(targets) {
  if (!targets || Object.keys(targets).length === 0) return '';
  const labels = {
    pending: 'Pending', registered: 'Registered', no_fit: 'No Fit',
    manual_login_needed: 'Manual Login', manual_apply_needed: 'Manual Apply',
    alert_only: 'Alert Only', applied: 'Applied', alerts_configured: 'Alerts Set',
    blocked: 'Blocked',
  };
  return Object.entries(targets).map(([key, count]) =>
    `<div class="target-pill"><span class="target-pill-num">${count}</span> ${labels[key] || key}</div>`
  ).join('');
}

function renderApp(data) {
  if (data.error) {
    return `<div class="error-banner">
      <svg class="error-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a1 1 0 011 1v3a1 1 0 01-2 0V5a1 1 0 011-1zm0 8a1 1 0 100-2 1 1 0 000 2z"/></svg>
      Error loading pipeline: ${escapeHtml(data.error)}
    </div>`;
  }

  const totalActive = ACTIVE_STAGES.reduce((sum, s) => sum + (data.funnel[s] || 0), 0);
  const totalClosed = ['rejected','withdrawn','skipped'].reduce((sum, s) => sum + (data.funnel[s] || 0), 0);
  const interviewCount = (data.funnel.interview || 0) + (data.funnel.screening || 0);
  const offerCount = data.funnel.offer || 0;
  const rejectCount = data.funnel.rejected || 0;

  return `
    <div class="header">
      <div class="header-left">
        <h1>Job Seeker Dashboard</h1>
        <span class="header-badge">${totalActive} active</span>
      </div>
      <div class="header-right">
        <div class="auto-refresh"><div class="pulse"></div> Auto-refresh 30s</div>
        <span class="header-meta">Last application: ${data.lastApplication ? formatDate(data.lastApplication) : 'none'}</span>
        <button class="refresh-btn" onclick="loadData()">Refresh</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card"><div class="stat-num" style="color:var(--vp-brand-1)">${totalActive}</div><div class="stat-label">Active</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--vp-green)">${interviewCount}</div><div class="stat-label">In Interview</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--vp-purple)">${offerCount}</div><div class="stat-label">Offers</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--vp-red)">${rejectCount}</div><div class="stat-label">Rejected</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--vp-text-2)">${totalClosed}</div><div class="stat-label">Closed</div></div>
    </div>

    <div class="section">
      <div class="section-title">Pipeline Funnel</div>
      <div class="funnel">${renderFunnel(data.funnel)}</div>
    </div>

    <div class="kanban">
      ${ACTIVE_STAGES.map(stage => renderColumn(stage, data.active)).join('')}
    </div>

    ${data.targets && Object.keys(data.targets).length > 0 ? `
    <div class="section">
      <div class="section-title">Target Companies</div>
      <div class="targets-row">${renderTargets(data.targets)}</div>
    </div>` : ''}

    <div class="section">
      <div class="section-title">Recent Messages</div>
      <div class="messages-list">${renderMessages(data.messages)}</div>
    </div>
  `;
}

async function loadData() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('/api/data');
    const data = await res.json();
    app.innerHTML = renderApp(data);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">
      <svg class="error-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a1 1 0 011 1v3a1 1 0 01-2 0V5a1 1 0 011-1zm0 8a1 1 0 100-2 1 1 0 000 2z"/></svg>
      Failed to load: ${escapeHtml(err.message)}
    </div>`;
  }
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
