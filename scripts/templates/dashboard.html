<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Seeker Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /*
   * Design tokens from VitePress default theme.
   * Dark theme is default; light theme via [data-theme="light"].
   */
  :root {
    /* Dark theme (default) */
    --vp-c-white: #ffffff;
    --vp-c-black: #000000;

    --vp-c-gray-1: #515c67;
    --vp-c-gray-2: #414853;
    --vp-c-gray-3: #32363f;
    --vp-c-gray-soft: rgba(101, 117, 133, 0.16);

    --vp-c-indigo-1: #a8b1ff;
    --vp-c-indigo-2: #5c73e7;
    --vp-c-indigo-3: #3e63dd;
    --vp-c-indigo-soft: rgba(100, 108, 255, 0.16);

    --vp-c-green-1: #3dd68c;
    --vp-c-green-2: #30a46c;
    --vp-c-green-3: #298459;
    --vp-c-green-soft: rgba(16, 185, 129, 0.16);

    --vp-c-yellow-1: #f9b44e;
    --vp-c-yellow-2: #da8b17;
    --vp-c-yellow-3: #a46a0a;
    --vp-c-yellow-soft: rgba(234, 179, 8, 0.16);

    --vp-c-red-1: #f66f81;
    --vp-c-red-2: #f14158;
    --vp-c-red-3: #b62a3c;
    --vp-c-red-soft: rgba(244, 63, 94, 0.16);

    --vp-c-purple-1: #c8abfa;
    --vp-c-purple-2: #a879e6;
    --vp-c-purple-3: #8e5cd9;
    --vp-c-purple-soft: rgba(159, 122, 234, 0.16);

    --vp-c-cyan-1: #22d3ee;
    --vp-c-cyan-soft: rgba(34, 211, 238, 0.16);
    --vp-c-orange-1: #f97316;
    --vp-c-orange-soft: rgba(249, 115, 22, 0.16);

    --vp-c-bg: #1b1b1f;
    --vp-c-bg-alt: #161618;
    --vp-c-bg-soft: #202127;
    --vp-c-bg-elv: #202127;

    --vp-c-border: #3c3f44;
    --vp-c-divider: #2e2e32;
    --vp-c-gutter: #000000;

    --vp-c-text-1: #dfdfd6;
    --vp-c-text-2: #98989f;
    --vp-c-text-3: #6a6a71;

    --vp-c-brand-1: var(--vp-c-indigo-1);
    --vp-c-brand-2: var(--vp-c-indigo-2);
    --vp-c-brand-3: var(--vp-c-indigo-3);
    --vp-c-brand-soft: var(--vp-c-indigo-soft);

    --vp-shadow-1: 0 1px 2px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
    --vp-shadow-2: 0 3px 12px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.07);
    --vp-shadow-3: 0 12px 32px rgba(0,0,0,.1), 0 2px 6px rgba(0,0,0,.08);

    --vp-transition: 250ms cubic-bezier(0.25, 0.1, 0.25, 1);

    --vp-font-family-base: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif,
      'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
    --vp-font-family-mono: ui-monospace, 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', monospace;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 20px;
  }

  [data-theme="light"] {
    --vp-c-gray-1: #dddde3;
    --vp-c-gray-2: #e4e4e9;
    --vp-c-gray-3: #ebebef;
    --vp-c-gray-soft: rgba(142, 150, 170, 0.14);

    --vp-c-indigo-1: #3451b2;
    --vp-c-indigo-2: #3a5ccc;
    --vp-c-indigo-3: #5672cd;
    --vp-c-indigo-soft: rgba(100, 108, 255, 0.14);

    --vp-c-green-1: #18794e;
    --vp-c-green-2: #299764;
    --vp-c-green-3: #30a46c;
    --vp-c-green-soft: rgba(16, 185, 129, 0.14);

    --vp-c-yellow-1: #915930;
    --vp-c-yellow-2: #946300;
    --vp-c-yellow-3: #9f6a00;
    --vp-c-yellow-soft: rgba(234, 179, 8, 0.14);

    --vp-c-red-1: #b8272c;
    --vp-c-red-2: #d5393e;
    --vp-c-red-3: #e0575b;
    --vp-c-red-soft: rgba(244, 63, 94, 0.14);

    --vp-c-purple-1: #6f42c1;
    --vp-c-purple-2: #7e4cc9;
    --vp-c-purple-3: #8e5cd9;
    --vp-c-purple-soft: rgba(159, 122, 234, 0.14);

    --vp-c-cyan-1: #0891b2;
    --vp-c-cyan-soft: rgba(34, 211, 238, 0.14);
    --vp-c-orange-1: #c2410c;
    --vp-c-orange-soft: rgba(249, 115, 22, 0.14);

    --vp-c-bg: #ffffff;
    --vp-c-bg-alt: #f6f6f7;
    --vp-c-bg-soft: #f6f6f7;
    --vp-c-bg-elv: #ffffff;

    --vp-c-border: #c2c2c4;
    --vp-c-divider: #e2e2e3;
    --vp-c-gutter: #e2e2e3;

    --vp-c-text-1: #3c3c43;
    --vp-c-text-2: #67676c;
    --vp-c-text-3: #929295;

    --vp-shadow-1: 0 1px 2px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
    --vp-shadow-2: 0 3px 12px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.07);
    --vp-shadow-3: 0 12px 32px rgba(0,0,0,.1), 0 2px 6px rgba(0,0,0,.08);
  }

  html, body {
    background: var(--vp-c-bg);
    color: var(--vp-c-text-1);
    font-family: var(--vp-font-family-base);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Smooth theme transitions */
  *, *::before, *::after {
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.2s ease;
  }

  button { font-family: inherit; }
  *:focus-visible {
    outline: 2px solid var(--vp-c-brand-1);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  /* ── Layout ── */
  .dashboard-layout {
    max-width: 1440px;
    margin: 0 auto;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 64px;
    background: var(--vp-c-bg-alt);
    border-bottom: 1px solid var(--vp-c-gutter);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    box-shadow: var(--vp-shadow-1);
  }
  .header-left {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--vp-c-text-1);
  }
  .header-welcome {
    font-size: 12px;
    color: var(--vp-c-text-3);
    font-weight: 500;
  }
  .header-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 14px;
    border-radius: var(--radius-pill);
    background: var(--vp-c-brand-soft);
    color: var(--vp-c-brand-1);
    border: 1px solid transparent;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-meta {
    font-size: 12px;
    color: var(--vp-c-text-2);
    white-space: nowrap;
  }

  .header-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: transparent;
    border: 1px solid var(--vp-c-border);
    color: var(--vp-c-text-2);
    height: 36px;
    padding: 0 14px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: var(--vp-transition);
    white-space: nowrap;
  }
  .header-btn:hover {
    border-color: var(--vp-c-brand-1);
    color: var(--vp-c-brand-1);
    background: var(--vp-c-brand-soft);
  }
  .header-btn:active { transform: scale(0.97); }
  .header-btn svg { width: 14px; height: 14px; }

  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }
  [data-theme="light"] .theme-toggle .icon-sun { display: block; }
  [data-theme="light"] .theme-toggle .icon-moon { display: none; }

  .auto-refresh {
    font-size: 11px;
    color: var(--vp-c-text-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pulse {
    width: 7px;
    height: 7px;
    background: var(--vp-c-green-1);
    border-radius: 50%;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
  }

  /* ── KPI Cards ── */
  .kpi-section {
    padding: 24px 28px;
    border-bottom: 1px solid var(--vp-c-divider);
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    min-width: 0;
  }
  @media (max-width: 1200px) {
    .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .kpi-grid { grid-template-columns: 1fr; }
  }
  .kpi-card {
    background: var(--vp-c-bg-soft);
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: var(--vp-transition);
    box-shadow: var(--vp-shadow-1);
    min-width: 0;
    overflow: hidden;
  }
  .kpi-card:hover {
    background: var(--vp-c-bg-elv);
    border-color: var(--vp-c-brand-1);
    box-shadow: var(--vp-shadow-2);
    transform: translateY(-1px);
  }
  .kpi-icon {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    flex-shrink: 0;
    color: var(--vp-c-white);
  }
  .kpi-content {
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .kpi-value {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.1;
    color: var(--vp-c-text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kpi-label {
    font-size: 9px;
    color: var(--vp-c-text-2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kpi-sublabel {
    font-size: 9px;
    color: var(--vp-c-text-3);
    margin-top: 4px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kpi-active .kpi-icon   { background: linear-gradient(135deg, var(--vp-c-indigo-2), var(--vp-c-indigo-3)); }
  .kpi-interview .kpi-icon { background: linear-gradient(135deg, var(--vp-c-green-2), var(--vp-c-green-3)); }
  .kpi-offer .kpi-icon    { background: linear-gradient(135deg, var(--vp-c-purple-2), var(--vp-c-purple-3)); }
  .kpi-rejected .kpi-icon { background: linear-gradient(135deg, var(--vp-c-red-2), var(--vp-c-red-3)); }
  .kpi-closed .kpi-icon   { background: linear-gradient(135deg, var(--vp-c-gray-1), var(--vp-c-gray-2)); }

  /* ── Section ── */
  .section {
    padding: 28px;
    border-bottom: 1px solid var(--vp-c-divider);
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--vp-c-text-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 18px;
  }

  /* ── Funnel ── */
  .funnel {
    display: flex;
    align-items: stretch;
    gap: 10px;
    height: 110px;
  }
  .funnel-stage {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    position: relative;
  }
  .funnel-bar-wrap {
    width: 100%;
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 0;
  }
  .funnel-bar {
    width: 100%;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8px;
    font-size: 13px;
    font-weight: 700;
    min-height: 24px;
    transition: var(--vp-transition);
    cursor: default;
    color: var(--vp-c-white);
  }
  .funnel-bar:hover { opacity: 0.85; transform: translateY(-2px); }
  .funnel-bar span { opacity: 0.95; }
  .funnel-label {
    text-align: center;
    font-size: 10px;
    color: var(--vp-c-text-3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-top: 10px;
    height: 26px;
    line-height: 1.3;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .funnel-arrow {
    position: absolute;
    right: -8px;
    top: 40%;
    color: var(--vp-c-text-3);
    font-size: 10px;
    z-index: 2;
  }
  .funnel-conversion {
    position: absolute;
    right: -28px;
    top: 40%;
    margin-top: 14px;
    color: var(--vp-c-text-3);
    font-size: 9px;
    font-family: var(--vp-font-family-mono);
    white-space: nowrap;
  }
  .funnel-bar-discovered { background: var(--vp-c-text-3); }
  .funnel-bar-contacted  { background: var(--vp-c-cyan-1); }
  .funnel-bar-applied    { background: var(--vp-c-brand-1); }
  .funnel-bar-in_review  { background: var(--vp-c-yellow-1); }
  .funnel-bar-screening  { background: var(--vp-c-orange-1); }
  .funnel-bar-interview  { background: var(--vp-c-green-1); }
  .funnel-bar-offer      { background: var(--vp-c-purple-1); }
  .funnel-bar-hired      { background: var(--vp-c-green-1); }

  [data-theme="light"] .funnel-bar-applied { background: var(--vp-c-indigo-1); }
  [data-theme="light"] .funnel-bar-interview,
  [data-theme="light"] .funnel-bar-hired { background: var(--vp-c-green-1); }
  [data-theme="light"] .funnel-bar-offer { background: var(--vp-c-purple-1); }
  [data-theme="light"] .funnel-bar-rejected { background: var(--vp-c-red-1); }

  /* ── Kanban ── */
  .kanban {
    display: flex;
    gap: 1px;
    background: var(--vp-c-divider);
    overflow-x: auto;
    min-height: 440px;
  }
  .column {
    flex: 1;
    min-width: 260px;
    background: var(--vp-c-bg);
    display: flex;
    flex-direction: column;
  }
  .column-header {
    padding: 14px 16px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--vp-c-border);
    position: sticky;
    top: 0;
    background: var(--vp-c-bg-alt);
    z-index: 10;
    border-left: 4px solid transparent;
  }
  .column-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--vp-c-text-1);
  }
  .column-count {
    font-size: 11px;
    color: var(--vp-c-text-3);
    font-weight: 600;
    background: var(--vp-c-bg-soft);
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--vp-c-border);
    min-width: 28px;
    text-align: center;
  }
  .column-cards {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
    flex: 1;
    background: var(--vp-c-bg);
  }

  /* Card */
  .card {
    background: var(--vp-c-bg-soft);
    border: 1px solid var(--vp-c-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    transition: var(--vp-transition);
    box-shadow: var(--vp-shadow-1);
  }
  .card:hover {
    background: var(--vp-c-bg-elv);
    border-color: var(--vp-c-text-3);
    box-shadow: var(--vp-shadow-2);
    transform: translateY(-2px);
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card-company {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--vp-c-text-1);
  }
  .card-date {
    font-size: 10px;
    color: var(--vp-c-text-3);
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
    font-weight: 500;
  }
  .card-role {
    font-size: 13px;
    color: var(--vp-c-text-2);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-tag {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    letter-spacing: 0.01em;
    border: 1px solid transparent;
  }
  .tag-high { background: var(--vp-c-green-soft); color: var(--vp-c-green-1); border-color: rgba(61,214,140,0.2); }
  .tag-medium { background: var(--vp-c-yellow-soft); color: var(--vp-c-yellow-1); border-color: rgba(249,180,78,0.2); }
  .tag-low { background: var(--vp-c-gray-soft); color: var(--vp-c-text-2); border-color: rgba(101,117,133,0.2); }
  .tag-platform { background: var(--vp-c-brand-soft); color: var(--vp-c-brand-1); border-color: rgba(100,108,255,0.2); }

  /* ── Messages ── */
  .messages-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 12px;
  }
  .message-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--vp-c-bg-soft);
    border: 1px solid var(--vp-c-border);
    border-radius: var(--radius);
    font-size: 13px;
    transition: var(--vp-transition);
    box-shadow: var(--vp-shadow-1);
  }
  .message-card:hover {
    background: var(--vp-c-bg-elv);
    border-color: var(--vp-c-text-3);
    box-shadow: var(--vp-shadow-2);
  }
  .message-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--vp-c-white);
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .message-body {
    flex: 1;
    min-width: 0;
  }
  .message-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .message-sender {
    color: var(--vp-c-text-1);
    font-weight: 600;
  }
  .message-channel {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.04em;
  }
  .ch-gmail { background: var(--vp-c-red-soft); color: var(--vp-c-red-1); }
  .ch-linkedin { background: var(--vp-c-brand-soft); color: var(--vp-c-brand-1); }
  .ch-platform { background: var(--vp-c-gray-soft); color: var(--vp-c-text-2); }
  .message-subject {
    color: var(--vp-c-text-2);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .message-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .message-status {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: var(--radius-pill);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .st-pending { background: var(--vp-c-yellow-soft); color: var(--vp-c-yellow-1); }
  .st-draft { background: var(--vp-c-brand-soft); color: var(--vp-c-brand-1); }
  .st-sent { background: var(--vp-c-green-soft); color: var(--vp-c-green-1); }
  .st-ignored { background: var(--vp-c-gray-soft); color: var(--vp-c-text-2); }
  .message-date {
    font-size: 10px;
    color: var(--vp-c-text-3);
    white-space: nowrap;
    font-weight: 500;
  }

  /* ── Targets ── */
  .targets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .target-group {
    background: var(--vp-c-bg-soft);
    border: 1px solid var(--vp-c-border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--vp-shadow-1);
    transition: var(--vp-transition);
  }
  .target-group:hover {
    border-color: var(--vp-c-text-3);
    box-shadow: var(--vp-shadow-2);
  }
  .target-group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .target-group-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--vp-c-text-1);
  }
  .target-group-count {
    font-size: 18px;
    font-weight: 800;
    color: var(--vp-c-brand-1);
  }
  .target-progress-bg {
    height: 6px;
    background: var(--vp-c-bg);
    border-radius: var(--radius-pill);
    overflow: hidden;
    border: 1px solid var(--vp-c-border);
  }
  .target-progress-fill {
    height: 100%;
    width: 100%;
    transform-origin: left;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, var(--vp-c-brand-2), var(--vp-c-brand-1));
    transform: scaleX(var(--progress, 0));
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .target-group-detail {
    font-size: 11px;
    color: var(--vp-c-text-3);
    margin-top: 8px;
    font-weight: 500;
  }

  /* ── Empty state ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    gap: 10px;
  }
  .empty-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius);
    background: var(--vp-c-bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--vp-c-text-3);
    border: 1px solid var(--vp-c-border);
  }
  .empty-icon svg { width: 20px; height: 20px; }
  .empty-text {
    font-size: 13px;
    color: var(--vp-c-text-2);
    font-weight: 500;
  }
  .empty-hint {
    font-size: 12px;
    color: var(--vp-c-text-3);
  }

  /* ── Skeleton loading ── */
  .skeleton-header {
    padding: 0 28px;
    height: 64px;
    background: var(--vp-c-bg-alt);
    border-bottom: 1px solid var(--vp-c-gutter);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .skeleton-block {
    background: linear-gradient(90deg, var(--vp-c-bg-soft) 0%, var(--vp-c-bg-elv) 50%, var(--vp-c-bg-soft) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: var(--radius-sm);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton-kpi {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    padding: 24px 28px;
    border-bottom: 1px solid var(--vp-c-divider);
  }
  .skeleton-kpi-card {
    background: var(--vp-c-bg-soft);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .skeleton-kanban {
    display: flex;
    gap: 1px;
    background: var(--vp-c-divider);
    padding-top: 28px;
    min-height: 440px;
  }
  .skeleton-col {
    flex: 1;
    min-width: 260px;
    background: var(--vp-c-bg);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── Error ── */
  .error-banner {
    background: var(--vp-c-red-soft);
    border: 1px solid var(--vp-c-red-1);
    color: var(--vp-c-red-1);
    padding: 16px 28px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
  }
  .error-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* ── Footer ── */
  .footer {
    padding: 20px 28px;
    border-top: 1px solid var(--vp-c-divider);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--vp-c-text-3);
  }
  .footer a {
    color: var(--vp-c-brand-1);
    text-decoration: none;
    font-weight: 600;
  }
  .footer a:hover { text-decoration: underline; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--vp-c-border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--vp-c-text-3); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .header { padding: 0 16px; }
    .header-welcome { display: none; }
    .header-meta { display: none; }
    .kpi-section, .section { padding: 16px; }
    .messages-grid { grid-template-columns: 1fr; }
    .targets-grid { grid-template-columns: 1fr; }
    .kanban { flex-direction: column; }
    .column { min-width: 100%; }
  }
</style>
</head>
<body>

      <div style="flex:1">

        <div class="skeleton-block" style="width:80px;height:22px;margin-bottom:6px"></div>

      <div style="flex:1">

<script>
const STAGE_INFO = {
  discovered:  { label: 'Discovered',  color: '#929295', gradient: 'funnel-bar-discovered' },
  contacted:   { label: 'Contacted',   color: '#22d3ee', gradient: 'funnel-bar-contacted' },
  applied:     { label: 'Applied',     color: '#a8b1ff', gradient: 'funnel-bar-applied' },
  in_review:   { label: 'In Review',   color: '#f9b44e', gradient: 'funnel-bar-in_review' },
  screening:   { label: 'Screening',   color: '#f97316', gradient: 'funnel-bar-screening' },
  interview:   { label: 'Interview',   color: '#3dd68c', gradient: 'funnel-bar-interview' },
  offer:       { label: 'Offer',       color: '#c8abfa', gradient: 'funnel-bar-offer' },
  hired:       { label: 'Hired',       color: '#3dd68c', gradient: 'funnel-bar-hired' },
  rejected:    { label: 'Rejected',    color: '#f66f81', gradient: 'funnel-bar-rejected' },
  withdrawn:   { label: 'Withdrawn',   color: '#929295', gradient: 'funnel-bar-discovered' },
  skipped:     { label: 'Skipped',     color: '#929295', gradient: 'funnel-bar-discovered' },
};

const ACTIVE_STAGES = ['discovered','contacted','applied','in_review','screening','interview','offer','hired'];

const CHANNEL_ICONS = {
  gmail: 'G',
  linkedin: 'in',
  platform: 'P'
};

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function initials(name, fallback='?') {
  if (!name) return fallback;
  return name.split(/\s+/).slice(0,2).map(w => w[0] || '').join('') || fallback;
}

function channelColor(channel) {
  if (channel === 'gmail') return 'var(--vp-c-red-1)';
  if (channel === 'linkedin') return 'var(--vp-c-brand-1)';
  return 'var(--vp-c-text-2)';
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString();
}

function matchTag(match) {
  if (!match) return '';
  const cls = match === 'high' ? 'tag-high' : match === 'medium' ? 'tag-medium' : 'tag-low';
  const label = match === 'high' ? 'Must' : match === 'medium' ? 'Strong' : 'Nice';
  return `<span class="card-tag ${cls}">${label}</span>`;
}

function platformTag(platform) {
  if (!platform) return '';
  return `<span class="card-tag tag-platform">${escapeHtml(platform)}</span>`;
}

function renderCard(card) {
  return `<div class="card" tabindex="0">
    <div class="card-top">
      <div class="card-company">${escapeHtml(card.company || 'Unknown')}</div>
      <div class="card-date" title="${new Date(card.applied_at).toLocaleString()}">${formatDate(card.applied_at)}</div>
    </div>
    <div class="card-role">${escapeHtml(card.role || '')}</div>
    <div class="card-meta">
      ${matchTag(card.match)}
      ${platformTag(card.platform)}
    </div>
  </div>`;
}

function renderColumn(stage, cards) {
  const info = STAGE_INFO[stage] || { label: stage, color: '#929295' };
  const filtered = cards.filter(c => c.status === stage);
  const emptyHtml = filtered.length === 0
    ? `<div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>
        <div class="empty-text">No applications here</div>
        <div class="empty-hint">Run "apply to N jobs" to populate</div>
      </div>`
    : filtered.map(renderCard).join('');
  return `<div class="column">
    <div class="column-header" style="border-left-color:${info.color}">
      <div class="column-header-left">
        <span style="color:${info.color}">${info.label}</span>
      </div>
      <span class="column-count">${filtered.length}</span>
    </div>
    <div class="column-cards">${emptyHtml}</div>
  </div>`;
}

function renderFunnel(funnel) {
  const stages = ACTIVE_STAGES;
  const maxCount = Math.max(...stages.map(s => funnel[s] || 0), 1);

  return stages.map((stage, i) => {
    const count = funnel[stage] || 0;
    const pct = (count / maxCount) * 100;
    const info = STAGE_INFO[stage];
    const nextCount = i < stages.length - 1 ? (funnel[stages[i + 1]] || 0) : null;
    const conversion = (count > 0 && nextCount !== null)
      ? Math.round((nextCount / count) * 100) + '%'
      : '';
    const arrow = i < stages.length - 1
      ? `<span class="funnel-arrow">→</span><div class="funnel-conversion">${count > 0 ? conversion : '-'}</div>`
      : '';

    return `<div class="funnel-stage">
      <div class="funnel-bar-wrap">
        <div class="funnel-bar ${info.gradient}" style="height:${Math.max(pct, 8)}%" title="${info.label}: ${count}">
          <span>${count}</span>
        </div>
      </div>
      <div class="funnel-label">${info.label}</div>
      ${arrow}
    </div>`;
  }).join('');
}

function renderMessages(messages) {
  if (!messages || messages.length === 0) {
    return `<div class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </div>
      <div class="empty-text">No recent messages</div>
      <div class="empty-hint">Run "news" to check for recruiter updates</div>
    </div>`;
  }
  return messages.map(m => {
    const chClass = m.channel === 'gmail' ? 'ch-gmail' : m.channel === 'linkedin' ? 'ch-linkedin' : 'ch-platform';
    const stClass = m.status ? 'st-' + m.status : 'st-pending';
    const chInitial = CHANNEL_ICONS[m.channel] || 'M';
    const color = channelColor(m.channel);
    const senderInitials = initials(m.sender, chInitial);
    const exactDate = m.received_at ? new Date(m.received_at).toLocaleString() : '';
    const borderColor = color;
    return `<div class="message-card" style="border-left-color:${borderColor}" title="${exactDate}">
      <div class="message-avatar" style="background:${color}">${senderInitials}</div>
      <div class="message-body">
        <div class="message-top">
          <span class="message-sender">${escapeHtml(m.sender || '')}</span>
          <span class="message-channel ${chClass}">${escapeHtml(m.channel || 'unknown')}</span>
        </div>
        <div class="message-subject">${escapeHtml(m.subject || '(no subject)')}</div>
        <div class="message-bottom">
          <span class="message-status ${stClass}">${escapeHtml(m.status || 'pending')}</span>
          <span class="message-date">${formatDate(m.received_at)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderTargets(targets) {
  if (!targets || Object.keys(targets).length === 0) {
    return `<div class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div class="empty-text">No target companies yet</div>
      <div class="empty-hint">Run "targets" to find companies</div>
    </div>`;
  }
  const labels = {
    pending: 'Pending', registered: 'Registered', no_fit: 'No Fit',
    manual_login_needed: 'Manual Login', manual_apply_needed: 'Manual Apply',
    alert_only: 'Alert Only', applied: 'Applied', alerts_configured: 'Alerts Set',
    blocked: 'Blocked',
  };
  const total = Object.values(targets).reduce((sum, c) => sum + c, 0);
  return Object.entries(targets).map(([key, count]) => {
    const pct = total > 0 ? (count / total) * 100 : 0;
    return `<div class="target-group">
      <div class="target-group-header">
        <span class="target-group-title">${labels[key] || key}</span>
        <span class="target-group-count">${count}</span>
      </div>
      <div class="target-progress-bg">
        <div class="target-progress-fill" style="--progress:${pct / 100}"></div>
      </div>
      <div class="target-group-detail">${Math.round(pct)}% of all targets</div>
    </div>`;
  }).join('');
}

function renderKpiCard(cls, value, label, sublabel, colorVar) {
  return `<div class="kpi-card kpi-${cls}">
    <div class="kpi-icon" style="background:linear-gradient(135deg, ${colorVar[0]}, ${colorVar[1]})">
      ${value}
    </div>
    <div class="kpi-content">
      <div class="kpi-value">${value}</div>
      <div class="kpi-label">${label}</div>
      <div class="kpi-sublabel">${sublabel}</div>
    </div>
  </div>`;
}

function renderApp(data) {
  if (data.error) {
    return `<div class="error-banner">
      <svg class="error-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a1 1 0 011 1v3a1 1 0 01-2 0V5a1 1 0 011-1zm0 8a1 1 0 100-2 1 1 0 000 2z"/></svg>
      Error loading pipeline: ${escapeHtml(data.error)}
    </div>`;
  }

  const totalActive = ACTIVE_STAGES.reduce((sum, s) => sum + (data.funnel[s] || 0), 0);
  const totalClosed = ['rejected','withdrawn','skipped'].reduce((sum, s) => sum + (data.funnel[s] || 0), 0);
  const interviewCount = (data.funnel.interview || 0) + (data.funnel.screening || 0);
  const offerCount = data.funnel.offer || 0;
  const rejectCount = data.funnel.rejected || 0;
  const welcome = data.userName ? `Welcome back, ${escapeHtml(data.userName)}` : '';

  const kpiCards = [
    renderKpiCard('active', totalActive, 'Active', 'Total in pipeline', ['var(--vp-c-indigo-2)', 'var(--vp-c-indigo-3)']),
    renderKpiCard('interview', interviewCount, 'In Interview', 'Screening + interview', ['var(--vp-c-green-2)', 'var(--vp-c-green-3)']),
    renderKpiCard('offer', offerCount, 'Offers', 'Negotiation stage', ['var(--vp-c-purple-2)', 'var(--vp-c-purple-3)']),
    renderKpiCard('rejected', rejectCount, 'Rejected', 'Closed without match', ['var(--vp-c-red-2)', 'var(--vp-c-red-3)']),
    renderKpiCard('closed', totalClosed, 'Closed', 'All time closed', ['var(--vp-c-gray-1)', 'var(--vp-c-gray-2)']),
  ].join('');

  return `
    <div class="dashboard-layout">
      <div class="header">
        <div class="header-left">
          <h1>Job Seeker Dashboard</h1>
          ${welcome ? `<span class="header-welcome">${welcome}</span>` : ''}
          <span class="header-badge">${totalActive} active</span>
        </div>
        <div class="header-right">
          <div class="auto-refresh"><div class="pulse"></div> Auto-refresh 30s</div>
          <span class="header-meta">Last activity: ${data.lastApplication ? formatDate(data.lastApplication) : 'none'}</span>
          <button class="header-btn theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle light/dark theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button class="header-btn" onclick="loadData()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Refresh
          </button>
        </div>
      </div>

      <div class="kpi-section">
        <div class="kpi-grid">
          ${kpiCards}
        </div>
      </div>

      <div class="section">
        <div class="section-title">Pipeline Funnel</div>
        <div class="funnel">${renderFunnel(data.funnel)}</div>
      </div>

      <div class="kanban">
        ${ACTIVE_STAGES.map(stage => renderColumn(stage, data.active)).join('')}
      </div>

      ${data.targets && Object.keys(data.targets).length > 0 ? `
      <div class="section">
        <div class="section-title">Target Companies</div>
        <div class="targets-grid">${renderTargets(data.targets)}</div>
      </div>` : ''}

      <div class="section">
        <div class="section-title">Recent Messages</div>
        <div class="messages-grid">${renderMessages(data.messages)}</div>
      </div>

      <div class="footer">
        <span>Job Seeker Dashboard</span>
        <a href="https://galiprandi.github.io/job-seeker/" target="_blank" rel="noopener">Documentation</a>
      </div>
    </div>
  `;
}

async function loadData() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('/api/data');
    const data = await res.json();
    app.innerHTML = renderApp(data);
  } catch (err) {
    app.innerHTML = `<div class="error-banner">
      <svg class="error-icon" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3a1 1 0 011 1v3a1 1 0 01-2 0V5a1 1 0 011-1zm0 8a1 1 0 100-2 1 1 0 000 2z"/></svg>
      Failed to load: ${escapeHtml(err.message)}
    </div>`;
  }
}

loadData();
setInterval(loadData, 30000);

/* ── Theme toggle ── */
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('dashboard-theme', next);
}

(function initTheme() {
  const saved = localStorage.getItem('dashboard-theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
</body>
</html>
